id = "cmc.iris"
name = "Iris"
# Semver, bumped at push time (not per-commit) — `herdr plugin install`
# pins by git commit SHA, not this field, so it's a human signal only, not
# load-bearing. While 0.x: minor for anything that changes what a user
# sees (new capability, new message, changed default), patch for a
# fix/perf change with no new observable capability, no bump for
# docs/tests/internal-only refactors.
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Fuzzy cheatsheet of AI agent skills/rules — scoped to the focused pane's agent when one is detected"
platforms = ["linux", "macos"]

[[build]]
command = ["bash", "install-deps.sh"]

# The user-facing entry point. Herdr qualifies it globally as `cmc.iris.open`.
# Bind this in config.toml (type = "plugin_action"), not the `list` pane below
# directly — plugin_action commands run through the server's own dispatch and
# get $HERDR_BIN_PATH, so they don't depend on `herdr` being on the user's PATH.
[[actions]]
id = "open"
title = "Skills cheatsheet (Iris)"
contexts = ["workspace"]
command = ["bash", "open.sh"]

[[panes]]
id = "list"
title = "Iris: skills"
placement = "popup"
command = ["bash", "list-skills.sh"]
width = "80%"
height = "80%"
